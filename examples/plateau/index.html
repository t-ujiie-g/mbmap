<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbmap: PLATEAU の建物</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #1c2330; --muted: #5d6878; --line: #e2e5ea; --accent: #2f5bd0; }
  html, body { height: 100%; margin: 0; font: 14px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; color: var(--ink); }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; top: 12px; left: 12px; width: 300px; max-height: calc(100% - 64px); overflow: auto; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.12); }
  .panel h1 { margin: 0 0 4px; font-size: 16px; }
  .panel p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
  .panel label { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .panel .places { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .panel button { padding: 3px 10px; font: inherit; color: var(--accent); background: #fff; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .panel button:hover { border-color: var(--accent); }
  #status { color: var(--muted); font-size: 12.5px; }
  #feature table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #feature th { width: 42%; padding: 3px 6px 3px 0; text-align: left; font-weight: 500; color: var(--muted); vertical-align: top; }
  #feature td { padding: 3px 0; overflow-wrap: anywhere; }
  #feature tr + tr > * { border-top: 1px solid var(--line); }
  #feature details { margin-top: 8px; font-size: 12.5px; }
  .credit { position: absolute; right: 0; bottom: 0; max-width: 70%; padding: 2px 8px; font-size: 11px; color: var(--muted); background: rgb(255 255 255 / 0.85); }
  @media (max-width: 600px) { .panel { top: auto; bottom: 40px; left: 8px; right: 8px; width: auto; max-height: 45%; } }
</style>
<!-- `npm --prefix bench run examples` installs the packed package into ./node_modules. -->
<script type="importmap">
  {
    "imports": {
      "mbmap": "./node_modules/mbmap/dist/index.js",
      "mbmap/3d": "./node_modules/mbmap/dist/3d.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>PLATEAU の建物</h1>
  <p>千代田区の 3D 都市モデル（LOD2）を 3D Tiles のまま読み、地図に重ねます。建物をクリックすると属性が出ます。</p>
  <label><input type="checkbox" id="plateau" checked> PLATEAU の建物（切ると地図の押し出しの建物）</label>
  <div class="places" id="places"></div>
  <div id="status">読み込み中…</div>
  <div id="feature"></div>
</div>
<div class="credit" id="credit"></div>
<script type="module" src="./main.js"></script>
