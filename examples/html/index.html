<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbmap showcase: plain HTML</title>
<link rel="stylesheet" href="../shared/app.css">
<!-- `npm --prefix bench run examples` installs the packed package into ./node_modules. -->
<script type="importmap">
  { "imports": { "mbmap": "./node_modules/mbmap/dist/index.js", "mbmap/analysis": "./node_modules/mbmap/dist/analysis.js" } }
</script>
<div id="map"></div>
<aside class="panel">
  <h1>mbmap</h1>
  <p class="variant">素の HTML（<code>import { Map } from "mbmap"</code>）</p>
  <h2>表示</h2>
  <div id="modes"><button data-mode="2d">2D</button><button data-mode="3d">3D</button></div>
  <h2>移動</h2>
  <div id="destinations"></div>
  <h2>カメラ</h2>
  <dl id="camera"></dl>
  <h2>中心から 5 km 以内の地点</h2>
  <ul id="near"></ul>
  <nav><a href="../html/">HTML</a><a href="../element/">Web Component</a><a href="../react/">React</a></nav>
</aside>
<script type="module" src="./main.js"></script>
