name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            npm/package-lock.json
            bench/package-lock.json
            examples/react/package-lock.json

      - name: Toolchain and dependencies (scripts/setup.sh, as on Claude Code on the web)
        run: |
          scripts/setup.sh --no-fixtures --no-browser
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon check
        run: moon check --target all --deny-warn
      - name: moon test
        run: moon test --target all
      - name: moon fmt
        run: moon fmt --check
      - name: Public interfaces (.mbti) are up to date
        run: moon info && git diff --exit-code -- '*.mbti'

      - name: Build and unit-test the npm package
        working-directory: npm
        run: npm run build && npm test
      - name: Bundle sizes
        working-directory: npm
        run: npm run size

      - name: Bench tooling
        working-directory: bench
        run: npm test
      - name: Packed package runs the example
        working-directory: bench
        run: npx playwright install --with-deps chromium && npm run npm:pack
